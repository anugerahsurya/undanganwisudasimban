<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laman Admin Manajemen Tamu Undangan Wisuda</title>
  
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

  <!-- Admin Header -->
  <header class="admin-header">
    <div class="header-container">
      <div class="header-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Portal Tamu Undangan Wisuda</span>
      </div>

      <div class="header-actions">
        <a href="index.html?to=Pratinjau+Tamu&cat=Umum" target="_blank" class="btn-nav">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Lihat Website Undangan</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="admin-main">
    
    <!-- Stats Overview -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
          </svg>
        </div>
        <div>
          <div id="stat-total" class="stat-value">0</div>
          <div class="stat-label">Total Tamu</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div>
          <div id="stat-vip" class="stat-value">0</div>
          <div class="stat-label">Dosen & Keluarga</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div>
          <div id="stat-friends" class="stat-value">0</div>
          <div class="stat-label">Sahabat & Rekan</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </div>
        <div>
          <div id="stat-links" class="stat-value">0</div>
          <div class="stat-label">Tautan Unik Terbuat</div>
        </div>
      </div>
    </section>

    <!-- 2. Form Input Tambah Tamu -->
    <section class="admin-card">
      <h2 class="card-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Tambah Tamu Undangan</span>
      </h2>
      <p class="card-subtitle">
        Masukkan data tamu untuk membuat tautan undangan unik secara otomatis.
      </p>
      
      <form id="quick-add-form" class="quick-add-form">
        <div class="form-group">
          <label for="add-name" class="form-label">Nama Tamu *</label>
          <input type="text" id="add-name" class="form-input" placeholder="Contoh: Budi Santoso, S.P." required>
        </div>

        <div class="form-group">
          <label for="add-category" class="form-label">Kategori / Hubungan</label>
          <input type="text" id="add-category" class="form-input" placeholder="Contoh: Sahabat Kampus, Dosen, Keluarga">
        </div>

        <div class="form-group">
          <label for="add-phone" class="form-label">Nomor WhatsApp (Opsional)</label>
          <input type="tel" id="add-phone" class="form-input" placeholder="Contoh: 08123456789">
        </div>

        <button type="submit" class="btn-gold-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Tambah Tamu</span>
        </button>
      </form>
    </section>

    <!-- 3. Tabel Daftar Undangan & Aksi -->
    <section class="admin-card">
      <div class="table-toolbar">
        <div class="search-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold-light)" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-guest" placeholder="Cari nama, kategori, atau no HP...">
        </div>

        <div class="toolbar-buttons">
          <button id="btn-reset-data" class="btn-action btn-delete" type="button" title="Kosongkan seluruh data tamu">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Kosongkan Semua Data</span>
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-responsive">
        <table class="guest-table">
          <thead>
            <tr>
              <th style="width: 50px;">No</th>
              <th>Nama Tamu</th>
              <th>Kategori</th>
              <th>No. WhatsApp</th>
              <th>Tautan Undangan Unik</th>
              <th style="width: 220px;">Aksi</th>
            </tr>
          </thead>
          <tbody id="guest-table-body">
            <!-- Populated dynamically via admin.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Admin Script -->
  <script src="assets/js/admin.js"></script>
</body>
</html>
